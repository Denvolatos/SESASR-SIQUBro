# Real robot. Used by: ros2 launch lab04_pkg ekf.launch.py robot:=real
ekf_node:
  ros__parameters:
    use_sim_time: false
    landmarks_topic: /camera/landmarks
    landmarks_file: landmarks_thu1211.yaml   # in lab04_pkg/config; an absolute path also works
    # The landmarks are in the map frame, so the start pose must be given in that frame too:
    # measure where the robot is placed in the arena before each run.
    init_pose: [0.0, 0.0, 0.0]     # [m, m, rad] in the map frame
    init_std: [0.3, 0.3, 0.3]      # the start pose is only known roughly
    prediction_rate: 20.0          # [Hz] required by the lab
    std_v: 0.05                    # [m/s]
    std_w: 0.1                     # [rad/s]
    std_range: 0.1                 # [m] not tuned yet on the robot
    std_bearing_deg: 3.0           # [deg] not tuned yet on the robot
    std_odom_v: 0.02               # [m/s]
    std_odom_w: 0.05               # [rad/s]
    std_imu_w: 0.02                # [rad/s]
