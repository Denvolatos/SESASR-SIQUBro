jin_ekf_node:
  ros__parameters:
    use_sim_time: false
    landmarks_topic: /camera/landmarks
    init_pose: [0.0, 0.0, 0.0]  # set to the measured start pose in the real arena
    init_std: [0.3, 0.3, 0.3]
    prediction_rate: 20.0
    max_odom_age: 0.5
    std_v: 0.05
    std_w: 0.1
    std_range: 0.1
    std_bearing_deg: 3.0
    innovation_gate: 0.0
